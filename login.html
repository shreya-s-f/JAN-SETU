<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — JanSetu 🇮🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at top, rgba(0, 102, 255, 0.12) 0%, #090d16 80%);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
    .demo-accounts-panel {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-top: 2rem;
    }
    .demo-btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .demo-btn {
      padding: 0.6rem 0.5rem;
      font-size: 0.8rem;
      text-align: center;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      cursor: pointer;
      color: var(--text-main);
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .demo-btn:hover {
      border-color: var(--primary);
      background: rgba(0, 102, 255, 0.1);
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
          <span class="flag-badge">🇮🇳</span>
          <span>JAN<span class="logo-accent">SETU</span></span>
        </a>
        <p class="text-muted" style="font-size: 0.9rem;">Sign in to your civic account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address <span class="required">*</span></label>
          <input type="email" id="login-email" class="form-control" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="d-flex justify-between align-center mb-1">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password <span class="required">*</span></label>
            <a href="forgot-password.html" style="font-size: 0.8rem; color: var(--primary);">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" id="toggle-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer;">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="d-flex align-center justify-between mb-3" style="font-size: 0.85rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="remember-me" checked> Remember this device
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
          Sign In <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="text-center mt-3" style="font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register as Citizen</a>
      </div>

      <!-- 1-Click Demo Accounts Switcher -->
      <div class="demo-accounts-panel">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim);">
            <i class="fa-solid fa-flask"></i> 1-Click Demo Logins
          </span>
          <span class="badge badge-primary">No Password Required</span>
        </div>
        <div class="demo-btn-grid">
          <button type="button" class="demo-btn" onclick="Auth.demoLogin('citizen')">
            <i class="fa-solid fa-user"></i><br>Citizen
          </button>
          <button type="button" class="demo-btn" onclick="Auth.demoLogin('admin')">
            <i class="fa-solid fa-shield-halved"></i><br>Admin (IAS)
          </button>
          <button type="button" class="demo-btn" onclick="Auth.demoLogin('worker')">
            <i class="fa-solid fa-helmet-safety"></i><br>Field Worker
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/emailService.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle password eye
      const pwdInput = document.getElementById('login-password');
      const toggleBtn = document.getElementById('toggle-password');
      if (toggleBtn && pwdInput) {
        toggleBtn.addEventListener('click', () => {
          const isPwd = pwdInput.type === 'password';
          pwdInput.type = isPwd ? 'text' : 'password';
          toggleBtn.innerHTML = isPwd ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
        });
      }

      // Handle custom form submit
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('login-email').value;
          const pwd = document.getElementById('login-password').value;

          const res = Auth.login(email, pwd);
          if (res.success) {
            UI.showToast({ type: 'success', title: 'Login Successful', message: `Welcome back, ${res.user.name}!` });
            setTimeout(() => Auth.redirectByRole(res.user.role), 600);
          } else {
            UI.showToast({ type: 'error', title: 'Login Failed', message: res.message });
          }
        });
      }
    });
  </script>
</body>
</html>
