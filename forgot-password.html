<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — JanSetu 🇮🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: radial-gradient(circle at top, rgba(0, 102, 255, 0.12) 0%, #090d16 80%);
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.5rem;">
          <span class="flag-badge">🇮🇳</span>
          <span>JAN<span class="logo-accent">SETU</span></span>
        </a>
        <h3 style="font-size: 1.25rem; font-weight: 700; margin-top: 0.5rem;">Reset Account Password</h3>
        <p class="text-muted" style="font-size: 0.88rem; margin-top: 0.25rem;">
          Enter your registered email address and we'll dispatch a simulated secure recovery link.
        </p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Registered Email Address <span class="required">*</span></label>
          <input type="email" id="forgot-email" class="form-control" placeholder="citizen@example.in" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-forgot-submit">
          Send Recovery Link <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="login.html" style="color: var(--text-muted); font-size: 0.88rem;">
          <i class="fa-solid fa-arrow-left"></i> Return to Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/emailService.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('forgot-email').value.trim();

          // Dispatch simulated password recovery email
          EmailService._dispatchSimulatedEmail({
            to: email,
            recipientName: 'JanSetu Citizen',
            subject: 'JanSetu: Password Reset Request',
            template: 'password_reset',
            htmlContent: `
              <div style="font-family: sans-serif; padding: 20px; line-height: 1.6;">
                <h3 style="color: #0066ff;">Password Reset Simulation</h3>
                <p>We received a password reset request for your JanSetu account.</p>
                <div style="margin: 20px 0;">
                  <a href="login.html" style="background: #0066ff; color: #fff; padding: 10px 20px; border-radius: 6px; text-decoration: none;">Reset Password Link</a>
                </div>
                <p style="color: #64748b; font-size: 0.85rem;">If you did not request this, you can safely ignore this simulation.</p>
              </div>
            `,
            plainText: `Click the link to reset your JanSetu password.`
          });

          UI.showToast({
            type: 'success',
            title: 'Recovery Link Sent',
            message: `A simulated password reset email has been sent to ${email}. Check Email Logs!`
          });

          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        });
      }
    });
  </script>
</body>
</html>
