<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore City Civic Map — JanSetu 🇮🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="d-flex align-center gap-2">
      <a href="index.html" class="brand-logo">
        <span class="flag-badge">🇮🇳</span>
        <span>JAN<span class="logo-accent">SETU</span></span>
      </a>
    </div>

    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="explore-issues.html" class="nav-link active">Explore City</a></li>
      <li><a href="transparency.html" class="nav-link">Transparency</a></li>
      <li><a href="about.html" class="nav-link">About</a></li>
    </ul>

    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle Theme">
        <i class="fa-regular fa-sun"></i>
      </button>
      <div id="nav-user-container">
        <a href="login.html" class="btn btn-primary btn-sm">Login</a>
      </div>
    </div>
  </header>

  <!-- Container for Explorer Map & Controls -->
  <div class="container-fluid" style="padding: 1.5rem;">
    <div class="filter-bar">
      <div class="search-input-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="map-search" class="form-control" placeholder="Search by locality, street or keyword (e.g. Indiranagar, water, pothole)...">
      </div>

      <div class="filter-group">
        <select id="map-city-filter" class="filter-select">
          <option value="all">All Indian Cities</option>
          <option value="Bengaluru" selected>Bengaluru</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Delhi">Delhi</option>
          <option value="Hyderabad">Hyderabad</option>
          <option value="Pune">Pune</option>
          <option value="Chennai">Chennai</option>
        </select>

        <select id="map-category-filter" class="filter-select">
          <option value="all">All Categories</option>
          <option value="Roads/Potholes">Roads/Potholes</option>
          <option value="Garbage">Garbage & Sanitation</option>
          <option value="Streetlights">Streetlights</option>
          <option value="Water Supply">Water Supply</option>
          <option value="Drainage/Flooding">Drainage & Stormwater</option>
          <option value="Traffic Signals">Traffic Signals</option>
          <option value="Damaged Infrastructure">Infrastructure</option>
        </select>

        <select id="map-status-filter" class="filter-select">
          <option value="all">All Statuses</option>
          <option value="submitted">Submitted</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
        </select>

        <button type="button" class="btn btn-outline btn-sm" id="btn-toggle-heatmap">
          <i class="fa-solid fa-fire text-danger"></i> Toggle Heatmap
        </button>

        <button type="button" class="btn btn-primary btn-sm" id="btn-toggle-3d-twin">
          <i class="fa-solid fa-cube text-cyan"></i> 3D Digital Twin View
        </button>
      </div>
    </div>

    <!-- Map Legend Bar -->
    <div style="display: flex; gap: 1.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; font-size: 0.85rem;">
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #ef4444; display: inline-block;"></span>
        <span>Critical Hazard (Score 80+)</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #f59e0b; display: inline-block;"></span>
        <span>High Priority (Score 60-79)</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #3b82f6; display: inline-block;"></span>
        <span>Medium Priority</span>
      </div>
      <div style="display: flex; align-items: center; gap: 0.4rem;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: #10b981; display: inline-block;"></span>
        <span>Resolved with Proof</span>
      </div>
      <span class="text-muted" style="margin-left: auto;" id="showing-count-text">Showing 22 issues</span>
    </div>

    <!-- Interactive Leaflet Map Box -->
    <div id="explore-leaflet-map" class="leaflet-map-fullscreen"></div>

    <!-- 3D Digital Twin Viewport (Toggleable) -->
    <div id="explore-3d-viewport" class="leaflet-map-fullscreen" style="display: none; position: relative; border-radius: var(--radius-lg); overflow: hidden; background: #030712;">
      <div class="twin-hud-overlay" style="position: absolute; top: 15px; left: 15px; z-index: 10; display: flex; gap: 0.75rem; flex-wrap: wrap;">
        <span class="hud-pill"><i class="fa-solid fa-satellite-dish"></i> Spatial 3D Ward Mode</span>
        <span class="hud-pill"><i class="fa-solid fa-hand"></i> Left-Click: Orbit &bull; Right-Click: Pan &bull; Scroll: Zoom</span>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/emailService.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/threeScene.js"></script>
  <script src="js/tilt3d.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let isHeatmapActive = false;
      const map = MapEngine.init('explore-leaflet-map', { center: [12.9716, 77.6412], zoom: 12 });

      const filterAndUpdate = () => {
        const city = document.getElementById('map-city-filter').value;
        const category = document.getElementById('map-category-filter').value;
        const status = document.getElementById('map-status-filter').value;
        const search = document.getElementById('map-search').value.toLowerCase();

        let list = Storage.get(STORAGE_KEYS.COMPLAINTS, []);
        if (city !== 'all') list = list.filter(c => c.city && c.city.toLowerCase() === city.toLowerCase());
        if (category !== 'all') list = list.filter(c => c.category === category);
        if (status !== 'all') list = list.filter(c => c.status === status);
        if (search) {
          list = list.filter(c =>
            c.title.toLowerCase().includes(search) ||
            c.id.toLowerCase().includes(search) ||
            (c.area && c.area.toLowerCase().includes(search))
          );
        }

        document.getElementById('showing-count-text').textContent = `Showing ${list.length} issues`;
        MapEngine.renderMarkers(list);

        if (isHeatmapActive) {
          MapEngine.renderHeatmap(list, category);
        }
      };

      filterAndUpdate();

      document.getElementById('map-city-filter').addEventListener('change', filterAndUpdate);
      document.getElementById('map-category-filter').addEventListener('change', filterAndUpdate);
      document.getElementById('map-status-filter').addEventListener('change', filterAndUpdate);
      document.getElementById('map-search').addEventListener('input', filterAndUpdate);

      // Heatmap toggle
      const heatmapBtn = document.getElementById('btn-toggle-heatmap');
      heatmapBtn.addEventListener('click', () => {
        isHeatmapActive = !isHeatmapActive;
        heatmapBtn.classList.toggle('btn-danger', isHeatmapActive);
        heatmapBtn.classList.toggle('btn-outline', !isHeatmapActive);
        filterAndUpdate();
      });

      // 3D Twin toggle
      let is3DActive = false;
      let is3DInitialized = false;
      const twinBtn = document.getElementById('btn-toggle-3d-twin');
      const leafletEl = document.getElementById('explore-leaflet-map');
      const twinEl = document.getElementById('explore-3d-viewport');

      twinBtn.addEventListener('click', () => {
        is3DActive = !is3DActive;
        twinBtn.classList.toggle('btn-secondary', is3DActive);
        twinBtn.classList.toggle('btn-primary', !is3DActive);

        if (is3DActive) {
          leafletEl.style.display = 'none';
          twinEl.style.display = 'block';
          if (!is3DInitialized && typeof ThreeCity !== 'undefined') {
            ThreeCity.init('explore-3d-viewport');
            is3DInitialized = true;
          }
          twinBtn.innerHTML = '<i class="fa-solid fa-map"></i> Switch to 2D Map';
        } else {
          twinEl.style.display = 'none';
          leafletEl.style.display = 'block';
          if (map && map.invalidateSize) map.invalidateSize();
          twinBtn.innerHTML = '<i class="fa-solid fa-cube text-cyan"></i> 3D Digital Twin View';
        }
      });
    });
  </script>
</body>
</html>
