<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-App Notification Center — JanSetu 🇮🇳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="d-flex align-center gap-2">
      <button class="mobile-nav-toggle" id="mobile-sidebar-toggle">
        <i class="fa-solid fa-bars"></i>
      </button>
      <a href="index.html" class="brand-logo">
        <span class="flag-badge">🇮🇳</span>
        <span>JAN<span class="logo-accent">SETU</span></span>
      </a>
    </div>

    <div class="nav-actions">
      <button class="icon-btn" id="theme-toggle-btn" aria-label="Toggle Theme">
        <i class="fa-regular fa-sun"></i>
      </button>
      <div id="nav-user-container"></div>
    </div>
  </header>

  <!-- App Layout -->
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-heading">Portal</div>
      <ul class="sidebar-nav">
        <li>
          <a href="citizen-dashboard.html" class="sidebar-link">
            <i class="fa-solid fa-gauge"></i> <span>Dashboard</span>
          </a>
        </li>
        <li>
          <a href="report-issue.html" class="sidebar-link">
            <i class="fa-solid fa-circle-plus"></i> <span>Report Issue</span>
          </a>
        </li>
        <li>
          <a href="my-complaints.html" class="sidebar-link">
            <i class="fa-solid fa-list-check"></i> <span>My Complaints</span>
          </a>
        </li>
        <li>
          <a href="explore-issues.html" class="sidebar-link">
            <i class="fa-solid fa-map-location-dot"></i> <span>Explore Issues</span>
          </a>
        </li>
        <li>
          <a href="notifications.html" class="sidebar-link active">
            <i class="fa-solid fa-bell"></i> <span>Notifications</span>
          </a>
        </li>
        <li>
          <a href="profile.html" class="sidebar-link">
            <i class="fa-solid fa-user-shield"></i> <span>Civic Profile</span>
          </a>
        </li>
        <li>
          <a href="settings.html" class="sidebar-link">
            <i class="fa-solid fa-sliders"></i> <span>Settings</span>
          </a>
        </li>
      </ul>
      <div class="sidebar-footer">
        <a href="javascript:void(0)" onclick="Auth.logout()" class="sidebar-link text-danger">
          <i class="fa-solid fa-right-from-bracket"></i> <span>Sign Out</span>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="dashboard-header">
        <div>
          <h1>Notification Center</h1>
          <p class="text-muted">Real-time alerts regarding your reported issues, municipal assignments, and community badges.</p>
        </div>
        <div class="dashboard-actions">
          <button class="btn btn-secondary btn-sm" id="btn-mark-all-read">
            <i class="fa-solid fa-check-double"></i> Mark All as Read
          </button>
        </div>
      </div>

      <!-- Notifications Feed Container -->
      <div class="card" style="max-width: 860px; margin: 0 auto; padding: 1.5rem;">
        <div id="notifications-feed" style="display: flex; flex-direction: column; gap: 1rem;"></div>
      </div>
    </main>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/priority.js"></script>
  <script src="js/complaints.js"></script>
  <script src="js/emailService.js"></script>
  <script src="js/ui.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!Auth.requireAuth(['citizen', 'admin', 'worker'])) return;
      const user = Auth.getCurrentUser();

      const renderNotifs = () => {
        const feed = document.getElementById('notifications-feed');
        const notifs = Notifications.getUserNotifications(user.id);

        if (notifs.length === 0) {
          feed.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon"><i class="fa-solid fa-bell-slash"></i></div>
              <div class="empty-state-title">No notifications yet</div>
              <p class="empty-state-desc">You're all caught up! You will receive updates here as field workers take action.</p>
            </div>
          `;
          return;
        }

        feed.innerHTML = notifs.map(n => {
          let icon = 'fa-bell text-primary';
          if (n.type === 'resolved') icon = 'fa-circle-check text-success';
          if (n.type === 'badge') icon = 'fa-award text-warning';
          if (n.type === 'civic_alert') icon = 'fa-bullhorn text-danger';

          return `
            <div style="display: flex; align-items: flex-start; gap: 1rem; padding: 1.1rem; border-radius: var(--radius-md); background: ${n.isRead ? 'var(--bg-surface)' : 'rgba(0, 102, 255, 0.08)'}; border: 1px solid ${n.isRead ? 'var(--border-color)' : 'rgba(0, 102, 255, 0.3)'};">
              <div style="font-size: 1.4rem; margin-top: 0.2rem;"><i class="fa-solid ${icon}"></i></div>
              <div style="flex: 1;">
                <div class="d-flex justify-between align-center mb-1">
                  <h4 style="font-size: 0.95rem; font-weight: 700;">${Utils.escapeHtml(n.title)}</h4>
                  <small class="text-muted">${Utils.timeAgo(n.createdAt)}</small>
                </div>
                <p style="font-size: 0.88rem; color: var(--text-muted);">${Utils.escapeHtml(n.message)}</p>
                <div class="d-flex gap-2 mt-2" style="align-items: center;">
                  ${n.complaintId ? `
                    <a href="complaint-details.html?id=${n.complaintId}" class="btn btn-secondary btn-sm" style="font-size: 0.8rem; padding: 0.25rem 0.6rem;">
                      View Complaint ${n.complaintId} <i class="fa-solid fa-arrow-right"></i>
                    </a>
                  ` : ''}
                  ${!n.isRead ? `
                    <button class="btn btn-outline btn-sm" style="font-size: 0.8rem; padding: 0.25rem 0.6rem;" onclick="Notifications.markAsRead('${n.id}'); renderNotifs();">
                      Mark Read
                    </button>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('');
      };

      renderNotifs();

      document.getElementById('btn-mark-all-read').addEventListener('click', () => {
        Notifications.markAllAsRead(user.id);
        renderNotifs();
        UI.showToast({ type: 'info', title: 'Notifications Updated', message: 'All notifications marked as read.' });
      });
    });
  </script>
</body>
</html>
